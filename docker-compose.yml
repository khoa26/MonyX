services:
  neo4j:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: monyx_neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/monyx_secret_password_2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - monyx_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p monyx_secret_password_2026 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monyx_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=MonyX API
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=monyx_secret_password_2026
      - JWT_SECRET_KEY=monyx_super_secret_jwt_key_risk_compliance_2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monyx_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  monyx_neo4j_data: